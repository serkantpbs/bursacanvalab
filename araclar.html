<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Araçlar | Canva Tasarım Laboratuvarı</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="page-hero"><div class="wrap">
      <div class="crumbs"><a href="index.html">Ana Sayfa</a> / Araçlar</div>
      <h1>Araçlar</h1>
      <p>Laboratuvardaki araçlar beş grupta toplanır. Her aracın tanıtım, kurulum ve kullanım sunusunu kartındaki düğmeden açabilirsiniz.</p>
    </div></section>
    <section class="block">
      <div class="wrap">
        <div class="toolbar">
          <input class="search" id="q" type="search" placeholder="Araç ara (ör. micro:bit, mikroskop)" aria-label="Araç ara">
        </div>
        <div class="scene-tabs" id="filters"></div>
        <div class="grid g4" id="tools"></div>
        <p class="muted hidden" id="empty">Aramanızla eşleşen bir araç bulunamadı.</p>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/icons.js"></script>
  <script>
    (function () {
      const D = LAB_DATA, subs = Object.fromEntries(D.ALT_SISTEMLER.map(s => [s.id, s]));
      let active = "hepsi";
      const f = document.getElementById("filters"), list = document.getElementById("tools"), q = document.getElementById("q");
      f.innerHTML = `<button class="chip active" data-id="hepsi">Tümü (${D.ARACLAR.length})</button>` +
        D.ALT_SISTEMLER.map(s => `<button class="chip" data-id="${s.id}">${esc(s.ad)} (${D.ARACLAR.filter(a => a.alt === s.id).length})</button>`).join("");
      f.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; active = b.dataset.id; f.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c === b)); render(); });
      q.addEventListener("input", render);
      function render() {
        const term = q.value.trim().toLocaleLowerCase("tr");
        const items = D.ARACLAR.filter(a => (active === "hepsi" || a.alt === active) && (!term || a.ad.toLocaleLowerCase("tr").includes(term)));
        list.innerHTML = items.map(a => {
          const s = subs[a.alt];
          return `<article class="tool-card" id="${esc(a.id)}">
            <div class="tool-media" style="background:${s.renk}">
              ${a.gorsel ? `<img src="${esc(a.gorsel)}" alt="${esc(a.ad)}" loading="lazy">` : LAB_ICONS[a.alt]}
            </div>
            <div class="tool-body">
              <span class="tag" style="--c:${s.renk}">${esc(s.ad)}</span>
              <h3>${esc(a.ad)}</h3>
              <p>${a.aciklama ? esc(a.aciklama) : "Açıklama yakında eklenecek."}</p>
              <div class="tool-links">${a.pdf ? `<a class="btn btn-soft btn-sm" href="${esc(a.pdf)}" target="_blank" rel="noopener">Sunuyu aç (PDF)</a>` : `<span class="soon">Sunu yakında</span>`}
              ${(a.ekler || []).map(e => `<a class="btn btn-soft btn-sm" href="${esc(e.pdf)}" target="_blank" rel="noopener">${esc(e.ad)}</a>`).join("")}</div>
            </div>
          </article>`;
        }).join("");
        document.getElementById("empty").classList.toggle("hidden", items.length > 0);
      }
      render();
      const h = decodeURIComponent(location.hash.slice(1));
      if (h.startsWith("alt-") && D.ALT_SISTEMLER.some(x => x.id === h.slice(4))) {
        active = h.slice(4); f.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c.dataset.id === active)); render();
      } else if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) setTimeout(() => t.scrollIntoView({ behavior: "smooth", block: "center" }), 100); }
    })();
  </script>
</body>
</html>
